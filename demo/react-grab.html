<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>React Grab demo | Agimut</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #101014;
        color: #f6f3ee;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-width: 320px;
        background:
          radial-gradient(circle at 15% 0%, rgba(209, 95, 255, 0.18), transparent 32rem),
          #101014;
      }

      button, input { font: inherit; }

      button {
        border: 0;
        cursor: pointer;
      }

      .page {
        width: min(1120px, calc(100% - 40px));
        margin: 0 auto;
        padding: 64px 0 80px;
      }

      .eyebrow {
        margin: 0 0 14px;
        color: #df8cff;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h1, h2, p { margin-top: 0; }

      h1 {
        max-width: 760px;
        margin-bottom: 18px;
        font-size: clamp(42px, 7vw, 78px);
        line-height: 0.96;
        letter-spacing: -0.06em;
      }

      .intro {
        max-width: 650px;
        color: #aaa7b4;
        font-size: 18px;
        line-height: 1.6;
      }

      .tip {
        display: inline-flex;
        gap: 8px;
        align-items: center;
        margin: 26px 0 48px;
        padding: 10px 14px;
        border: 1px solid #393443;
        border-radius: 999px;
        color: #d9d4e2;
        font-size: 14px;
        background: rgba(255, 255, 255, 0.04);
      }

      .tip kbd {
        padding: 2px 6px;
        border: 1px solid #5c526a;
        border-radius: 5px;
        color: #fff;
        background: #2a2431;
      }

      .grid {
        display: grid;
        grid-template-columns: 1.25fr 0.75fr;
        gap: 18px;
      }

      .card {
        padding: 26px;
        border: 1px solid #302d39;
        border-radius: 22px;
        background: rgba(25, 24, 31, 0.88);
        box-shadow: 0 18px 70px rgba(0, 0, 0, 0.22);
      }

      .card h2 {
        margin-bottom: 8px;
        font-size: 22px;
        letter-spacing: -0.03em;
      }

      .muted {
        margin-bottom: 22px;
        color: #94909d;
        font-size: 14px;
        line-height: 1.55;
      }

      .stat-row {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin-top: 26px;
      }

      .stat {
        padding: 15px;
        border-radius: 14px;
        background: #211f28;
      }

      .stat strong {
        display: block;
        margin-bottom: 5px;
        font-size: 24px;
      }

      .stat span {
        color: #9995a3;
        font-size: 12px;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 24px;
      }

      .primary, .secondary {
        padding: 12px 16px;
        border-radius: 11px;
        font-weight: 750;
      }

      .primary {
        color: #1d1024;
        background: #e08cff;
      }

      .secondary {
        border: 1px solid #4b4355;
        color: #eee9f2;
        background: transparent;
      }

      .task-list {
        display: grid;
        gap: 10px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .task {
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 13px 14px;
        border-radius: 13px;
        background: #211f28;
      }

      .task input { accent-color: #e08cff; }

      .task label {
        flex: 1;
        color: #d9d4e2;
        font-size: 14px;
      }

      .task small {
        color: #8c8796;
        font-size: 11px;
      }

      .footer {
        margin-top: 22px;
        color: #777380;
        font-size: 13px;
      }

      @media (max-width: 760px) {
        .page { padding-top: 40px; }
        .grid { grid-template-columns: 1fr; }
        .stat-row { grid-template-columns: 1fr; }
      }
    </style>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/react-grab/dist/index.global.js"></script>
  </head>
  <body>
    <main id="root"></main>

    <script>
      const { createElement: h, useState } = React;

      function DemoHeader() {
        return h(
          React.Fragment,
          null,
          h('p', { className: 'eyebrow' }, 'React Grab playground'),
          h('h1', null, 'Point at anything. Copy the context.'),
          h(
            'p',
            { className: 'intro' },
            'This small React page is here to test element picking, component names, nested structure, and clipboard output. Hover a component, then press Cmd/Ctrl+C.',
          ),
          h(
            'div',
            { className: 'tip' },
            h('span', null, 'Try selecting the highlighted button or a task row'),
            h('kbd', null, '⌘C'),
          ),
        );
      }

      function MetricsCard() {
        const [started, setStarted] = useState(false);
        return h(
          'section',
          { className: 'card metrics-card' },
          h('h2', null, 'Release dashboard'),
          h('p', { className: 'muted' }, 'A deliberately nested component with buttons, metrics, and changing state.'),
          h(
            'div',
            { className: 'actions' },
            h('button', { className: 'primary', onClick: () => setStarted(!started) }, started ? 'Running now' : 'Start review'),
            h('button', { className: 'secondary', onClick: () => alert('This is a demo action.') }, 'View changelog'),
          ),
          h(
            'div',
            { className: 'stat-row' },
            h('div', { className: 'stat' }, h('strong', null, started ? '94%' : '87%'), h('span', null, 'Confidence')),
            h('div', { className: 'stat' }, h('strong', null, '24'), h('span', null, 'Open notes')),
            h('div', { className: 'stat' }, h('strong', null, '12m'), h('span', null, 'Saved today')),
          ),
        );
      }

      function TaskCard() {
        const [tasks, setTasks] = useState([
          { id: 1, label: 'Review the navigation spacing', owner: 'Design', done: true },
          { id: 2, label: 'Check the empty state copy', owner: 'Content', done: false },
          { id: 3, label: 'Confirm mobile card layout', owner: 'QA', done: false },
        ]);

        function toggleTask(id) {
          setTasks(tasks.map((task) => task.id === id ? { ...task, done: !task.done } : task));
        }

        return h(
          'section',
          { className: 'card task-card' },
          h('h2', null, 'Review queue'),
          h('p', { className: 'muted' }, 'Try the parent card, a task row, a label, or one of the checkboxes.'),
          h(
            'ul',
            { className: 'task-list' },
            tasks.map((task) => h(
              'li',
              { className: 'task', key: task.id },
              h('input', { id: 'task-' + task.id, type: 'checkbox', checked: task.done, onChange: () => toggleTask(task.id) }),
              h('label', { htmlFor: 'task-' + task.id }, task.label),
              h('small', null, task.owner),
            )),
          ),
        );
      }

      function DemoApp() {
        return h(
          'div',
          { className: 'page' },
          h(DemoHeader),
          h('div', { className: 'grid' }, h(MetricsCard), h(TaskCard)),
          h('p', { className: 'footer' }, 'The page is intentionally built with named React components so React Grab has useful component context to inspect.'),
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(h(DemoApp));
    </script>
  </body>
</html>
